name: update-feed

on:
  schedule:
    # UTC. GitHub delays scheduled runs by 0-40 min; the benchmark's daily
    # gate lives in the CLI, so jitter only shifts the digest, never skips it.
    # 21:17 UTC = 06:17 JST = the digest is generated ahead of the 07:00
    # JST Teams publication.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      which:
        description: Which update to run
        type: choice
        default: auto
        options:
          - auto
          - new-model
          - benchmark
  push:
    branches: [main]
    paths-ignore:
      # The workflow's own commits use GITHUB_TOKEN (never re-triggers), but
      # also skip human pushes that only touch generated files.
      - "docs/**"
      - "state/**"

concurrency:
  # Serialize every run so two updates never race on the state commit.
  group: update-feed
  cancel-in-progress: false

permissions:
  contents: write # push state + feeds; branch-mode Pages needs nothing more

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Both optional: the HF token just raises datasets-server rate limits,
      # the GitHub token just raises api.github.com limits for LiveBench's
      # snapshot discovery. Neither grants access to anything private.
      GITHUB_TOKEN: ${{ github.token }}
      HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history keeps the rebase-retry below bulletproof
      # Queued runs start from the SHA that triggered them, which can trail
      # behind main after an earlier run in this concurrency group pushed a
      # digest. Rebasing onto origin/main here makes every run read the
      # freshest state (gate, snapshots, item cache) — without it a stale
      # checkout can clobber a freshly published feed.
      - name: Sync with latest main
        run: git fetch origin main && git rebase origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # npm ci runs the pinned bot's `prepare`, building dist/ from the
      # allowScripts-approved commit recorded in package.json.
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Update feeds
        run: |
          case "${{ inputs.which }}" in
            benchmark) node dist/cli.js benchmark --force ;;
            new-model) node dist/cli.js new-model ;;
            *) node dist/cli.js auto ;;
          esac
      - name: Validate RSS
        run: node dist/cli.js validate
      - name: Commit state and feeds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state docs
          if git diff --cached --quiet; then
            echo "No changes; skipping commit"
          else
            git commit -m "feed: update $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          fi
      - name: Push with rebase retry
        run: |
          for i in 1 2 3; do
            if git push; then exit 0; fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
            sleep $((i * 5))
          done
          exit 1
